<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Political Attitudes in the Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
:root {
  --navy: #212b58;
  --text: #252525;
  --muted: #666666;
  --grid: #dddddd;
  --background: #ffffff;
  --uk-grey: #9aa0a6;
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
}

header {
  height: 122px;
  padding: 10px 30px 4px;
  text-align: center;
}

h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(24px, 2vw, 36px);
}

.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: clamp(13px, .95vw, 17px);
}

.header-row {
  margin-top: 7px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.response-count {
  font-size: clamp(15px, 1.05vw, 19px);
  font-weight: bold;
}

.compare-toggle {
  border: 2px solid var(--navy);
  background: white;
  color: var(--navy);
  border-radius: 999px;
  padding: 7px 16px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  transition: .15s ease;
}

.compare-toggle:hover {
  background: #f4f5f8;
}

.compare-toggle[aria-pressed="true"] {
  background: var(--navy);
  color: white;
}

.compare-toggle:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.visuals {
  height: calc(100vh - 122px);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 5px 24px 18px;
}

/* 9 × 9 */
.ideology-panel {
  height: 100%;
  aspect-ratio: 1 / 1;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: white;
  border: 1px solid #e3e3e3;
  border-radius: 8px;
  padding: 8px;
}

/* 6 × 9 */
.populism-panel {
  height: 100%;
  aspect-ratio: 2 / 3;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: white;
  border: 1px solid #e3e3e3;
  border-radius: 8px;
  padding: 4px;
}

#populismPlot {
  width: 100%;
  height: 100%;
}

@media (max-aspect-ratio: 4/3) {
  html,
  body {
    overflow: auto;
  }

  header {
    height: auto;
  }

  .header-row {
    flex-wrap: wrap;
  }

  .visuals {
    height: auto;
    flex-direction: column;
  }

  .ideology-panel {
    width: 95vw;
    height: auto;
  }

  .populism-panel {
    width: 70vw;
    height: 650px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Political attitudes in the room</h1>

  <div class="subtitle">
    Economic left–right position, libertarian–authoritarian values and populism
  </div>

  <div class="header-row">
    <div id="count" class="response-count">
      0 student responses
    </div>

    <button
      id="compareToggle"
      class="compare-toggle"
      type="button"
      aria-pressed="false"
      disabled>
      Compare with UK
    </button>
  </div>
</header>

<div class="visuals">

  <div class="ideology-panel">
    <canvas id="politicalChart"></canvas>
  </div>

  <div class="populism-panel">
    <div id="populismPlot"></div>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://ftlrakgamcoznsyfubdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MSCbhs-KZgIjyiIzYpcf4g_MTl-Z0cl";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let studentResults = [];
let ukResults = [];
let showUK = false;

/* ==========================================================
   POPULISM COLOUR SCALE FOR STUDENT DOTS
   ========================================================== */

function interpolateColour(
  start,
  end,
  t,
  alpha = 0.8
) {
  const r =
    Math.round(
      start[0] +
      (end[0] - start[0]) * t
    );

  const g =
    Math.round(
      start[1] +
      (end[1] - start[1]) * t
    );

  const b =
    Math.round(
      start[2] +
      (end[2] - start[2]) * t
    );

  return `rgba(${r},${g},${b},${alpha})`;
}

function populismColour(
  score,
  alpha = 0.82
) {
  const low = [253,231,37];
  const middle = [33,145,140];
  const high = [68,1,84];

  if (score <= 50) {
    return interpolateColour(
      low,
      middle,
      score / 50,
      alpha
    );
  }

  return interpolateColour(
    middle,
    high,
    (score - 50) / 50,
    alpha
  );
}

/* ==========================================================
   2D IDEOLOGICAL SPACE
   ========================================================== */

const politicalCanvas =
  document.getElementById(
    "politicalChart"
  );

const politicalChart =
  new Chart(
    politicalCanvas,
    {
      type: "scatter",

      data: {
        datasets: []
      },

      options: {
        responsive: true,
        maintainAspectRatio: false,

        animation: {
          duration: 300
        },

        layout: {
          padding: {
            top: 5,
            right: 5,
            bottom: 5,
            left: 5
          }
        },

        scales: {
          x: {
            min: -100,
            max: 100,

            title: {
              display: true,
              text:
                "LEFT   ←   Economic position   →   RIGHT",
              color: "#212b58",
              font: {
                size: 16,
                weight: "bold"
              }
            },

            ticks: {
              stepSize: 25,
              font: {
                size: 13
              }
            },

            grid: {
              color:
                context =>
                  context.tick.value === 0
                  ? "#555555"
                  : "#dddddd",

              lineWidth:
                context =>
                  context.tick.value === 0
                  ? 2
                  : 1
            }
          },

          y: {
            min: -100,
            max: 100,

            title: {
              display: true,
              text:
                "LIBERTARIAN   ←   Values   →   AUTHORITARIAN",
              color: "#212b58",
              font: {
                size: 16,
                weight: "bold"
              }
            },

            ticks: {
              stepSize: 25,
              font: {
                size: 13
              }
            },

            grid: {
              color:
                context =>
                  context.tick.value === 0
                  ? "#555555"
                  : "#dddddd",

              lineWidth:
                context =>
                  context.tick.value === 0
                  ? 2
                  : 1
            }
          }
        },

        plugins: {
          title: {
            display: true,
            text:
              "Left–right and libertarian–authoritarian position",
            color: "#212b58",
            font: {
              size: 18,
              weight: "bold"
            },
            padding: {
              bottom: 8
            }
          },

          legend: {
            display: true,
            position: "top",
            labels: {
              usePointStyle: true,
              boxWidth: 10
            }
          },

          tooltip: {
            callbacks: {
              label:
                context => {
                  const p =
                    context.raw;

                  if (
                    context.dataset.label ===
                    "UK BES W27"
                  ) {
                    return [
                      `UK BES W27`,
                      `Left–right: ${Math.round(p.x)}`,
                      `Lib–Auth: ${Math.round(p.y)}`,
                      `Populism: ${Math.round(p.populism)}`
                    ];
                  }

                  return [
                    `Student`,
                    `Left–right: ${Math.round(p.x)}`,
                    `Lib–Auth: ${Math.round(p.y)}`,
                    `Populism: ${Math.round(p.populism)}`
                  ];
                }
            }
          }
        }
      }
    }
  );

function updatePoliticalChart() {
  const datasets = [];

  if (showUK) {
    datasets.push({
      label: "UK BES W27",
      data:
        ukResults.map(
          r => ({
            x: Number(r.left_right),
            y: Number(r.lib_auth),
            populism: Number(r.populism)
          })
        ),
      pointRadius: 2.2,
      pointHoverRadius: 4,
      pointBackgroundColor:
        "rgba(135,135,135,0.18)",
      pointBorderWidth: 0,
      order: 1
    });
  }

  datasets.push({
    label: "Students",
    data:
      studentResults.map(
        r => ({
          x: Number(r.left_right),
          y: Number(r.lib_auth),
          populism: Number(r.populism)
        })
      ),
    pointRadius: 6,
    pointHoverRadius: 9,
    pointBackgroundColor:
      context => {
        if (!context.raw) {
          return "#777777";
        }

        return populismColour(
          context.raw.populism
        );
      },
    pointBorderColor:
      "rgba(0,0,0,0.25)",
    pointBorderWidth: 1,
    order: 2
  });

  politicalChart.data.datasets =
    datasets;

  politicalChart.update();
}

/* ==========================================================
   SPLIT VIOLIN PLOT

   Students = left half
   UK BES W27 = right half
   ========================================================== */

function numericPopulism(
  results
) {
  return results
    .map(
      r =>
        Number(
          r.populism
        )
    )
    .filter(
      score =>
        Number.isFinite(
          score
        )
    );
}

function updateViolinPlot() {
  const studentScores =
    numericPopulism(
      studentResults
    );

  const ukScores =
    numericPopulism(
      ukResults
    );

  const studentTrace = {
    type: "violin",
    y: studentScores,
    x:
      studentScores.map(
        () => "Populism"
      ),

    name: "Students",
    side:
      showUK
      ? "negative"
      : "both",

    orientation: "v",

    box: {
      visible: true
    },

    meanline: {
      visible: true
    },

    points: false,
    spanmode: "hard",
    span: [0,100],
    scalemode: "width",
    scalegroup:
      showUK
      ? "comparison"
      : "students",

    width:
      showUK
      ? 1.15
      : 0.85,

    line: {
      color: "#212b58",
      width: 2
    },

    fillcolor:
      "rgba(33,43,88,0.55)",

    hoveron:
      "violins+kde",

    hovertemplate:
      "Students<br>Populism score: %{y:.1f}<extra></extra>",

    legendgroup:
      "Students"
  };

  const traces =
    [studentTrace];

  if (showUK) {
    traces.push({
      type: "violin",
      y: ukScores,
      x:
        ukScores.map(
          () => "Populism"
        ),

      name: "UK BES W27",
      side: "positive",
      orientation: "v",

      box: {
        visible: true
      },

      meanline: {
        visible: true
      },

      points: false,
      spanmode: "hard",
      span: [0,100],
      scalemode: "width",
      scalegroup: "comparison",
      width: 1.15,

      line: {
        color: "#777777",
        width: 2
      },

      fillcolor:
        "rgba(150,150,150,0.45)",

      hoveron:
        "violins+kde",

      hovertemplate:
        "UK BES W27<br>Populism score: %{y:.1f}<extra></extra>",

      legendgroup:
        "UK BES W27"
    });
  }

  const layout = {
    title: {
      text:
        showUK
        ? "Populism: students vs UK BES W27"
        : "Distribution of student populist attitudes",

      font: {
        size: 20,
        color: "#212b58"
      },

      x: 0.5,
      xanchor: "center"
    },

    margin: {
      l: 70,
      r: 25,
      t: 78,
      b: 45
    },

    paper_bgcolor: "#ffffff",
    plot_bgcolor: "#ffffff",

    showlegend: showUK,

    legend: {
      orientation: "h",
      x: 0.5,
      xanchor: "center",
      y: 1.04,
      yanchor: "bottom",
      font: {
        size: 13
      }
    },

    violinmode: "overlay",

    xaxis: {
      visible: false,
      fixedrange: true
    },

    yaxis: {
      range: [0,100],
      fixedrange: true,
      dtick: 20,

      title: {
        text: "POPULISM SCORE",
        font: {
          size: 16,
          color: "#212b58"
        }
      },

      tickfont: {
        size: 14,
        color: "#333333"
      },

      gridcolor: "#dddddd",
      zeroline: false
    },

    annotations:
      showUK
      ? [
          {
            x: 0.31,
            y: 1.0,
            xref: "paper",
            yref: "paper",
            text: "<b>STUDENTS</b>",
            showarrow: false,
            yshift: -8,
            font: {
              size: 14,
              color: "#212b58"
            }
          },
          {
            x: 0.69,
            y: 1.0,
            xref: "paper",
            yref: "paper",
            text: "<b>UK BES W27</b>",
            showarrow: false,
            yshift: -8,
            font: {
              size: 14,
              color: "#666666"
            }
          }
        ]
      : []
  };

  const config = {
    responsive: true,
    displayModeBar: false,
    staticPlot: false
  };

  Plotly.react(
    "populismPlot",
    traces,
    layout,
    config
  );
}

/* ==========================================================
   LOAD STATIC UK BES W27 REFERENCE DATA
   ========================================================== */

async function loadUKData() {
  const toggle =
    document.getElementById(
      "compareToggle"
    );

  try {
    const response =
      await fetch(
        "uk_bes_w27_scores.json",
        {
          cache: "force-cache"
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const json =
      await response.json();

    ukResults =
      Array.isArray(json)
      ? json
      : (json.data || []);

    toggle.disabled = false;

  } catch (error) {
    console.error(
      "Could not load UK BES comparison data:",
      error
    );

    toggle.disabled = true;
    toggle.textContent =
      "UK comparison unavailable";
  }
}

/* ==========================================================
   LIVE STUDENT RESULTS
   ========================================================== */

async function refreshStudentResults() {
  const {
    data,
    error
  } =
    await db
      .from("responses")
      .select(
        "left_right, lib_auth, populism"
      );

  if (error) {
    console.error(
      "Could not retrieve student results:",
      error
    );

    return;
  }

  studentResults =
    data || [];

  updateDisplay();
}

/* ==========================================================
   HEADER / TOGGLE
   ========================================================== */

function updateHeader() {
  const count =
    document.getElementById(
      "count"
    );

  if (showUK) {
    count.textContent =
      `${studentResults.length} student responses · ${ukResults.length.toLocaleString()} UK BES W27 respondents`;
  } else {
    count.textContent =
      studentResults.length === 1
      ? "1 student response"
      : `${studentResults.length} student responses`;
  }

  const toggle =
    document.getElementById(
      "compareToggle"
    );

  toggle.setAttribute(
    "aria-pressed",
    showUK
      ? "true"
      : "false"
  );

  toggle.textContent =
    showUK
    ? "Hide UK comparison"
    : "Compare with UK";
}

function updateDisplay() {
  updateHeader();
  updatePoliticalChart();
  updateViolinPlot();
}

document
  .getElementById(
    "compareToggle"
  )
  .addEventListener(
    "click",
    () => {
      if (
        ukResults.length === 0
      ) {
        return;
      }

      showUK =
        !showUK;

      updateDisplay();
    }
  );

/* ==========================================================
   INITIALISE
   ========================================================== */

async function initialise() {
  await loadUKData();
  await refreshStudentResults();

  setInterval(
    refreshStudentResults,
    3000
  );
}

initialise();
</script>

</body>
</html>
