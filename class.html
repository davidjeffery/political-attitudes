<script>

const db =

/* ==========================================================
   2. POPULISM COLOUR SCALE

   Viridis-style:
   yellow = lower populism
   green = middle
   purple = higher populism
   ========================================================== */

function interpolateColour(
  start,
  end,
  t,
  alpha = 0.8
) {

  const r =
    Math.round(
      start[0] +
      (end[0] - start[0]) * t
    );

  const g =
    Math.round(
      start[1] +
      (end[1] - start[1]) * t
    );

  const b =
    Math.round(
      start[2] +
      (end[2] - start[2]) * t
    );

  return `rgba(${r},${g},${b},${alpha})`;

}


function populismColour(
  score,
  alpha = 0.82
) {

  const low =
    [253, 231, 37];

  const middle =
    [33, 145, 140];

  const high =
    [68, 1, 84];


  if (score <= 50) {

    return interpolateColour(
      low,
      middle,
      score / 50,
      alpha
    );

  }


  return interpolateColour(
    middle,
    high,
    (score - 50) / 50,
    alpha
  );

}


/* ==========================================================
   3. LEFT-HAND IDEOLOGICAL SPACE
   ========================================================== */

const politicalCanvas =

const politicalChart =

      options: {

        scales: {

              }

            grid: {

              color:

                  context.tick.value === 0
                  ? "#555"

              lineWidth:

                  ? 2

            }

          },


          y: {

            min: -100,
            max: 100,

            title: {

              display: true,

              text:
                "LIBERTARIAN   ←   Values   →   AUTHORITARIAN",

              color:
                "#212b58",

              font: {
                size: 16,
                weight: "bold"
              }

            },

            ticks: {

              stepSize: 25,

              font: {
                size: 13
              }

            },

            grid: {

              color:
                context =>
                  context.tick.value === 0
                  ? "#555"
                  : "#dddddd",

              lineWidth:
                context =>
                  context.tick.value === 0
                  ? 2
                  : 1

            }

          }

        },


        plugins: {

          title: {

            display: true,

            text:

              "#212b58",

            font: {

/* ==========================================================
   4. MAKE POPULISM BEESWARM

   Vertical scale:
   0   = lower populism
   100 = higher populism

   Horizontal position has NO substantive meaning.
   It is only used to separate overlapping observations.
   ========================================================== */

function makeBeeswarm(
  results
) {

  const sorted =
    results
      .map(r => ({
        score:
          Number(r.populism)
      }))
      .sort(
        (a, b) =>
          a.score - b.score
      );


  const bins = {};

  const points = [];


  sorted.forEach(
    respondent => {

      const score =
        respondent.score;


      /*
      Group nearby results together.

      A 4-point bin works well
      for roughly 50–200 respondents.
      */

      const bin =
        Math.round(
          score / 4
        );


      if (
        bins[bin] === undefined
      ) {

        bins[bin] = 0;

      }


      const position =
        bins[bin];


      /*
      Symmetrical horizontal stacking:

      0
      +1
      -1
      +2
      -2
      etc.
      */

      let offset = 0;


      if (position > 0) {

        const level =
          Math.ceil(
            position / 2
          );


        offset =
          position % 2 === 1
          ? level
          : -level;

      }


      points.push({

        x:
          offset,

        y:
          score,

        populism:
          score

      });


      bins[bin]++;

    }
  );


  return points;

}


/* ==========================================================
   5. RIGHT-HAND POPULISM BEESWARM
   ========================================================== */

      options: {

        maintainAspectRatio: false,

        animation: {
          duration: 350

        layout: {

          padding: {

          }

        },


        scales: {

          x: {

            min: -9,

            display: false,

            grid: {

            border: {

              }

            },

              color:

              lineWidth:

            }

        plugins: {

          title: {

            display: true,

            text:
              "Distribution of populist attitudes",

            color:
              "#212b58",

            font: {
              size: 18,
              weight: "bold"
            },

            padding: {
              bottom: 8
            }

          legend: {
            display: false
          },


          tooltip: {

            callbacks: {

              label:
                context =>

            }

          }

        }

      }

    }

/* ==========================================================
   6. RETRIEVE AND DISPLAY DATA
   ========================================================== */

async function refreshResults() {

  const {
    data,
    error
  } =
    await db
      .from("responses")
      .select(
        "left_right, lib_auth, populism"
      );


  if (error) {

    console.error(
      "Could not retrieve results:",
      error
    );

    return;

  }


  const results =
    data || [];


  /* -------------------------------
     UPDATE IDEOLOGICAL SPACE
     ------------------------------- */

  politicalChart
    .data
    .datasets[0]
    .data =

      results.map(
        r => ({

          x:
            Number(
              r.left_right
            ),

          y:
            Number(
              r.lib_auth
            ),

          populism:
            Number(
              r.populism
            )

        })
      );


  politicalChart.update();


  /* -------------------------------
     UPDATE POPULISM BEESWARM
     ------------------------------- */

  populismChart
    .data
    .datasets[0]
    .data =

      makeBeeswarm(
        results
      );


  populismChart.update();


  /* -------------------------------
     UPDATE N
     ------------------------------- */

  document
    .getElementById("count")
    .textContent =

      results.length === 1

      ? "1 response"

      : `${results.length} responses`;

}


/* ==========================================================
   7. LIVE REFRESH

   Refresh immediately, then every 3 seconds.
   ========================================================== */

refreshResults();


setInterval(
  refreshResults,
  3000
);

</script>
