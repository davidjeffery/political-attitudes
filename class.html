<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class Political Attitudes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: white;
  color: #222;
}

.page {
  width: min(1400px, 96vw);
  margin: 20px auto;
}

h1 {
  margin: 0;
  text-align: center;
  color: #212b58;
  font-size: 2rem;
}

.subtitle {
  text-align: center;
  color: #666;
  margin: 8px 0 12px;
}

.count {
  text-align: center;
  font-size: 1.15rem;
  font-weight: bold;
  margin-bottom: 5px;
}

.chart-container {
  position: relative;
  width: 100%;
  height: 72vh;
}

.legend-title {
  text-align: center;
  font-weight: bold;
  margin-top: 5px;
}

.colour-key {
  width: min(500px, 80%);
  height: 18px;
  margin: 6px auto 0;
  border-radius: 10px;

  background: linear-gradient(
    to right,
    #fde725,
    #21918c,
    #440154
  );
}

.colour-labels {
  width: min(500px, 80%);
  margin: 4px auto;
  display: flex;
  justify-content: space-between;
  color: #666;
  font-size: .9rem;
}

.status {
  text-align: center;
  color: #777;
  font-size: .85rem;
  margin-top: 6px;
}

</style>
</head>

<body>

<div class="page">

<h1>Political attitudes in the room</h1>

<div class="subtitle">
Economic left–right position, libertarian–authoritarian values and populism
</div>

<div id="count" class="count">
0 responses
</div>

<div class="chart-container">
<canvas id="politicalChart"></canvas>
</div>

<div class="legend-title">
Colour = populism score
</div>

<div class="colour-key"></div>

<div class="colour-labels">
<span>Lower populism</span>
<span>Higher populism</span>
</div>

<div id="status" class="status">
Waiting for responses…
</div>

</div>


<script>

/* ==========================================================
   1. YOUR SUPABASE DETAILS

   COPY THE SAME TWO VALUES FROM index.html
   ========================================================== */

const SUPABASE_URL =
  "https://ftlrakgamcoznsyfubdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MSCbhs-KZgIjyiIzYpcf4g_MTl-Z0cl";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==========================================================
   2. COLOUR FUNCTIONS
   ========================================================== */

function interpolateColour(
  start,
  end,
  t,
  alpha
) {

  const r =
    Math.round(
      start[0] +
      (end[0] - start[0]) * t
    );

  const g =
    Math.round(
      start[1] +
      (end[1] - start[1]) * t
    );

  const b =
    Math.round(
      start[2] +
      (end[2] - start[2]) * t
    );

  return `rgba(${r},${g},${b},${alpha})`;
}


function populismColour(
  score,
  alpha = 0.8
) {

  const low =
    [253,231,37];

  const middle =
    [33,145,140];

  const high =
    [68,1,84];


  if (score <= 50) {

    return interpolateColour(
      low,
      middle,
      score / 50,
      alpha
    );

  }

  return interpolateColour(
    middle,
    high,
    (score - 50) / 50,
    alpha
  );

}


/* ==========================================================
   3. CHART
   ========================================================== */

const canvas =
  document.getElementById(
    "politicalChart"
  );

const chart =
  new Chart(
    canvas,
    {

      type: "scatter",

      data: {

        datasets: [

          {
            label: "Respondents",

            data: [],

            pointRadius: 7,

            pointHoverRadius: 9,

            pointBackgroundColor:
              context => {

                if (!context.raw)
                  return "#777";

                return populismColour(
                  context.raw.populism
                );

              },

            pointBorderColor:
              "rgba(0,0,0,0.25)",

            pointBorderWidth:
              1

          }

        ]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,

        animation: {
          duration: 400
        },

        scales: {

          x: {

            min: -100,
            max: 100,

            title: {
              display: true,
              text:
                "LEFT   ←   Economic position   →   RIGHT",

              font: {
                size: 16,
                weight: "bold"
              }
            },

            ticks: {
              stepSize: 25,
              font: {
                size: 13
              }
            },

            grid: {

              color:
                context =>
                  context.tick.value === 0
                  ? "#555"
                  : "#dddddd",

              lineWidth:
                context =>
                  context.tick.value === 0
                  ? 2
                  : 1

            }

          },


          y: {

            min: -100,
            max: 100,

            title: {
              display: true,
              text:
                "LIBERTARIAN   ←   Values   →   AUTHORITARIAN",

              font: {
                size: 16,
                weight: "bold"
              }
            },

            ticks: {
              stepSize: 25,
              font: {
                size: 13
              }
            },

            grid: {

              color:
                context =>
                  context.tick.value === 0
                  ? "#555"
                  : "#dddddd",

              lineWidth:
                context =>
                  context.tick.value === 0
                  ? 2
                  : 1

            }

          }

        },


        plugins: {

          legend: {
            display: false
          },

          tooltip: {

            callbacks: {

              label:
                context => {

                  const p =
                    context.raw;

                  return [

                    `Left–right: ${Math.round(p.x)}`,

                    `Lib–Auth: ${Math.round(p.y)}`,

                    `Populism: ${Math.round(p.populism)}`

                  ];

                }

            }

          }

        }

      }

    }
  );


/* ==========================================================
   4. DOWNLOAD CLASS RESULTS
   ========================================================== */

async function refreshResults() {

  const status =
    document.getElementById("status");

  const { data, error } =
    await db
      .from("responses")
      .select(
        "left_right, lib_auth, populism"
      );


  if (error) {

    console.error(error);

    status.textContent =
      "Could not retrieve class results.";

    return;

  }


  const results =
    data || [];


  chart.data.datasets[0].data =
    results.map(
      r => ({

        x:
          Number(
            r.left_right
          ),

        y:
          Number(
            r.lib_auth
          ),

        populism:
          Number(
            r.populism
          )

      })
    );


  chart.update();


  document
    .getElementById("count")
    .textContent =
      results.length === 1
      ? "1 response"
      : `${results.length} responses`;


  status.textContent =
    "Live class results";

}


/* ==========================================================
   5. REFRESH AUTOMATICALLY
   ========================================================== */

refreshResults();

setInterval(
  refreshResults,
  3000
);

</script>

</body>
</html>
