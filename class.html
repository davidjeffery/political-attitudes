<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Political Attitudes in the Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
:root {
  --navy: #212b58;
  --text: #252525;
  --muted: #666666;
  --background: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--background);
  color: var(--text);
}

header {
  height: 118px;
  padding: 10px 30px 4px;
  text-align: center;
}

h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(24px, 2vw, 36px);
}

.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: clamp(13px, .95vw, 17px);
}

.header-row {
  margin-top: 7px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
}

.response-count {
  font-size: clamp(15px, 1.05vw, 19px);
  font-weight: bold;
}

.compare-toggle {
  border: 2px solid var(--navy);
  background: white;
  color: var(--navy);
  border-radius: 999px;
  padding: 7px 16px;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  transition:
    background-color .12s ease,
    color .12s ease;
}

.compare-toggle:hover {
  background: #f4f5f8;
}

.compare-toggle[aria-pressed="true"] {
  background: var(--navy);
  color: white;
}

.compare-toggle:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.visuals {
  height: calc(100vh - 118px);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 5px 24px 18px;
}

/* 9 × 9 */
.ideology-panel {
  height: 100%;
  aspect-ratio: 1 / 1;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: white;
  border: 1px solid #e3e3e3;
  border-radius: 8px;
  padding: 4px;
}

/* 6 × 9 */
.populism-panel {
  height: 100%;
  aspect-ratio: 2 / 3;
  min-width: 0;
  min-height: 0;
  position: relative;
  background: white;
  border: 1px solid #e3e3e3;
  border-radius: 8px;
  padding: 4px;
}

#politicalPlot,
#populismPlot {
  width: 100%;
  height: 100%;
}

@media (max-aspect-ratio: 4/3) {
  html,
  body {
    overflow: auto;
  }

  header {
    height: auto;
  }

  .header-row {
    flex-wrap: wrap;
  }

  .visuals {
    height: auto;
    flex-direction: column;
  }

  .ideology-panel {
    width: 95vw;
    height: 95vw;
  }

  .populism-panel {
    width: 70vw;
    height: 650px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Political attitudes in the room</h1>

  <div class="subtitle">
    Economic left–right position, libertarian–authoritarian values and populism
  </div>

  <div class="header-row">
    <div id="count" class="response-count">
      0 student responses
    </div>

    <button
      id="compareToggle"
      class="compare-toggle"
      type="button"
      aria-pressed="false"
      disabled>
      Compare with UK
    </button>
  </div>
</header>

<div class="visuals">

  <div class="ideology-panel">
    <div id="politicalPlot"></div>
  </div>

  <div class="populism-panel">
    <div id="populismPlot"></div>
  </div>

</div>

<script>
/* ==========================================================
   1. SUPABASE
   ========================================================== */

const SUPABASE_URL =
  "https://ftlrakgamcoznsyfubdy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_MSCbhs-KZgIjyiIzYpcf4g_MTl-Z0cl";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let studentResults = [];
let ukResults = [];
let showUK = false;
let lastStudentSignature = "";


/* ==========================================================
   2. COMMON PLOTLY SETTINGS
   ========================================================== */

const plotConfig = {
  responsive: true,
  displayModeBar: false,
  staticPlot: false
};


/* ==========================================================
   3. STUDENT COLOUR SCALE
   ========================================================== */

const studentColourScale = [
  [0.00, "#fde725"],
  [0.50, "#21918c"],
  [1.00, "#440154"]
];


/* ==========================================================
   4. LEFT-HAND POLITICAL SPACE

   Students remain individual coloured points.

   In comparison mode, UK BES W27 is shown as a density
   contour rather than thousands of individual dots.
   ========================================================== */

function updatePoliticalPlot() {

  const traces = [];


  if (showUK && ukResults.length > 0) {

    /*
    UK density layer:
    the filled 2D contour shows where BES respondents
    are concentrated without overwhelming the student dots.
    */

    traces.push({

      type: "histogram2dcontour",

      x:
        ukResults.map(
          r => Number(r.left_right)
        ),

      y:
        ukResults.map(
          r => Number(r.lib_auth)
        ),

      name:
        "UK BES W27",

      showscale:
        false,

      showlegend:
        true,

      hoverinfo:
        "skip",

      ncontours:
        10,

      histnorm:
        "probability density",

      colorscale: [
        [0.00, "rgba(245,245,245,0.00)"],
        [0.20, "rgba(220,220,220,0.18)"],
        [0.45, "rgba(185,185,185,0.28)"],
        [0.70, "rgba(145,145,145,0.38)"],
        [1.00, "rgba(100,100,100,0.52)"]
      ],

      contours: {
        coloring: "fill",
        showlines: true
      },

      line: {
        color: "rgba(90,90,90,0.55)",
        width: 1
      }

    });

  }


  /*
  Student points:
  colour continues to encode populism from 0 to 100.
  */

  traces.push({

    type: "scatter",

    mode: "markers",

    x:
      studentResults.map(
        r => Number(r.left_right)
      ),

    y:
      studentResults.map(
        r => Number(r.lib_auth)
      ),

    name:
      "Students",

    customdata:
      studentResults.map(
        r => Number(r.populism)
      ),

    marker: {

      size:
        10,

      color:
        studentResults.map(
          r => Number(r.populism)
        ),

      cmin:
        0,

      cmax:
        100,

      colorscale:
        studentColourScale,

      showscale:
        false,

      line: {
        color:
          "rgba(0,0,0,0.30)",
        width:
          0.7
      }

    },

    hovertemplate:
      "Student" +
      "<br>Left–right: %{x:.0f}" +
      "<br>Lib–Auth: %{y:.0f}" +
      "<br>Populism: %{customdata:.0f}" +
      "<extra></extra>"

  });


  /*
  Plotly's histogram contour legend symbol is not especially
  intuitive, so in comparison mode we use a small invisible
  helper trace to create a clean UK legend marker.
  */

  if (showUK && ukResults.length > 0) {

    traces.push({

      type: "scatter",

      mode: "markers",

      x: [null],
      y: [null],

      name:
        "UK BES W27",

      marker: {
        size:
          10,
        color:
          "rgba(120,120,120,0.55)",
        symbol:
          "square"
      },

      hoverinfo:
        "skip",

      showlegend:
        true

    });

    /*
    Suppress the contour trace's own legend entry;
    the helper marker above gives a cleaner legend.
    */

    traces[0].showlegend =
      false;

  }


  const layout = {

    title: {

      text:
        "Left–right and libertarian–authoritarian position",

      font: {
        size:
          19,
        color:
          "#212b58"
      },

      x:
        0.5,

      xanchor:
        "center"

    },

    margin: {
      l:
        74,
      r:
        26,
      t:
        76,
      b:
        70
    },

    paper_bgcolor:
      "#ffffff",

    plot_bgcolor:
      "#ffffff",

    showlegend:
      true,

    legend: {

      orientation:
        "h",

      x:
        0.5,

      xanchor:
        "center",

      y:
        1.02,

      yanchor:
        "bottom",

      font: {
        size:
          13
      }

    },

    hovermode:
      "closest",

    uirevision:
      "fixed",

    xaxis: {

      range:
        [-100,100],

      fixedrange:
        true,

      dtick:
        25,

      title: {

        text:
          "LEFT   ←   Economic position   →   RIGHT",

        font: {
          size:
            15,
          color:
            "#212b58"
        }

      },

      tickfont: {
        size:
          12
      },

      gridcolor:
        "#dddddd",

      zeroline:
        true,

      zerolinecolor:
        "#555555",

      zerolinewidth:
        2

    },

    yaxis: {

      range:
        [-100,100],

      fixedrange:
        true,

      dtick:
        25,

      title: {

        text:
          "LIBERTARIAN   ←   Values   →   AUTHORITARIAN",

        font: {
          size:
            15,
          color:
            "#212b58"
        }

      },

      tickfont: {
        size:
          12
      },

      gridcolor:
        "#dddddd",

      zeroline:
        true,

      zerolinecolor:
        "#555555",

      zerolinewidth:
        2,

      scaleanchor:
        "x",

      scaleratio:
        1

    }

  };


  /*
  Plotly.react replaces the data without transition animation.
  There is no fade/redraw animation between refreshes.
  */

  Plotly.react(
    "politicalPlot",
    traces,
    layout,
    plotConfig
  );

}


/* ==========================================================
   5. RIGHT-HAND POPULISM VIOLIN

   Students only:
     normal full violin.

   Compare mode:
     LEFT half  = students
     RIGHT half = UK BES W27

   Only the simple Students / UK BES W27 legend is shown.
   ========================================================== */

function numericPopulism(
  results
) {

  return results
    .map(
      r => Number(r.populism)
    )
    .filter(
      score =>
        Number.isFinite(score)
    );

}


function updateViolinPlot() {

  const studentScores =
    numericPopulism(
      studentResults
    );

  const ukScores =
    numericPopulism(
      ukResults
    );


  const traces = [{

    type:
      "violin",

    y:
      studentScores,

    x:
      studentScores.map(
        () => "Populism"
      ),

    name:
      "Students",

    side:
      showUK
      ? "negative"
      : "both",

    orientation:
      "v",

    box: {
      visible:
        true
    },

    meanline: {
      visible:
        true
    },

    points:
      false,

    spanmode:
      "hard",

    span:
      [0,100],

    scalemode:
      "width",

    scalegroup:
      showUK
      ? "comparison"
      : "students",

    width:
      showUK
      ? 1.10
      : 0.82,

    line: {
      color:
        "#212b58",
      width:
        2
    },

    fillcolor:
      "rgba(33,43,88,0.58)",

    hoveron:
      "violins+kde",

    hovertemplate:
      "Students" +
      "<br>Populism score: %{y:.1f}" +
      "<extra></extra>"

  }];


  if (
    showUK &&
    ukScores.length > 0
  ) {

    traces.push({

      type:
        "violin",

      y:
        ukScores,

      x:
        ukScores.map(
          () => "Populism"
        ),

      name:
        "UK BES W27",

      side:
        "positive",

      orientation:
        "v",

      box: {
        visible:
          true
      },

      meanline: {
        visible:
          true
      },

      points:
        false,

      spanmode:
        "hard",

      span:
        [0,100],

      scalemode:
        "width",

      scalegroup:
        "comparison",

      width:
        1.10,

      line: {
        color:
          "#777777",
        width:
          2
      },

      fillcolor:
        "rgba(145,145,145,0.48)",

      hoveron:
        "violins+kde",

      hovertemplate:
        "UK BES W27" +
        "<br>Populism score: %{y:.1f}" +
        "<extra></extra>"

    });

  }


  const layout = {

    title: {

      text:
        "Distribution of populist attitudes",

      font: {
        size:
          19,
        color:
          "#212b58"
      },

      x:
        0.5,

      xanchor:
        "center"

    },

    margin: {
      l:
        68,
      r:
        22,
      t:
        76,
      b:
        44
    },

    paper_bgcolor:
      "#ffffff",

    plot_bgcolor:
      "#ffffff",

    showlegend:
      showUK,

    legend: {

      orientation:
        "v",

      x:
        0.98,

      xanchor:
        "right",

      y:
        0.98,

      yanchor:
        "top",

      bgcolor:
        "rgba(255,255,255,0.82)",

      bordercolor:
        "rgba(220,220,220,0.9)",

      borderwidth:
        1,

      font: {
        size:
          12
      }

    },

    violinmode:
      "overlay",

    hovermode:
      "closest",

    uirevision:
      "fixed",

    xaxis: {

      visible:
        false,

      fixedrange:
        true

    },

    yaxis: {

      range:
        [0,100],

      fixedrange:
        true,

      dtick:
        20,

      title: {

        text:
          "POPULISM SCORE",

        font: {
          size:
            15,
          color:
            "#212b58"
        }

      },

      tickfont: {
        size:
          13,
        color:
          "#333333"
      },

      gridcolor:
        "#dddddd",

      zeroline:
        false

    }

  };


  Plotly.react(
    "populismPlot",
    traces,
    layout,
    plotConfig
  );

}


/* ==========================================================
   6. STATIC UK BES DATA
   ========================================================== */

async function loadUKData() {

  const toggle =
    document.getElementById(
      "compareToggle"
    );


  try {

    const response =
      await fetch(
        "uk_bes_w27_scores.json",
        {
          cache:
            "force-cache"
        }
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const json =
      await response.json();


    ukResults =
      Array.isArray(json)
      ? json
      : (json.data || []);


    toggle.disabled =
      false;


  } catch (error) {

    console.error(
      "Could not load UK BES comparison data:",
      error
    );


    toggle.disabled =
      true;


    toggle.textContent =
      "UK comparison unavailable";

  }

}


/* ==========================================================
   7. LIVE STUDENT DATA

   Poll every 3 seconds, but only redraw if the data have
   actually changed. This removes needless flickering.
   ========================================================== */

function makeStudentSignature(
  results
) {

  return results
    .map(
      r =>
        [
          r.id,
          r.left_right,
          r.lib_auth,
          r.populism
        ].join(":")
    )
    .join("|");

}


async function refreshStudentResults() {

  const {
    data,
    error
  } =
    await db
      .from("responses")
      .select(
        "id, left_right, lib_auth, populism, created_at"
      )
      .order(
        "created_at",
        {
          ascending:
            true
        }
      );


  if (error) {

    console.error(
      "Could not retrieve student results:",
      error
    );

    return;

  }


  const freshResults =
    data || [];


  const freshSignature =
    makeStudentSignature(
      freshResults
    );


  /*
  If nothing has changed, do absolutely nothing.
  The page still checks Supabase every three seconds,
  but the charts are not redrawn.
  */

  if (
    freshSignature ===
    lastStudentSignature
  ) {

    return;

  }


  lastStudentSignature =
    freshSignature;


  studentResults =
    freshResults;


  updateDisplay();

}


/* ==========================================================
   8. HEADER / TOGGLE
   ========================================================== */

function updateHeader() {

  const count =
    document.getElementById(
      "count"
    );


  count.textContent =
    studentResults.length === 1
    ? "1 student response"
    : `${studentResults.length} student responses`;


  const toggle =
    document.getElementById(
      "compareToggle"
    );


  toggle.setAttribute(
    "aria-pressed",
    showUK
      ? "true"
      : "false"
  );


  toggle.textContent =
    showUK
    ? "Students only"
    : "Compare with UK";

}


function updateDisplay() {

  updateHeader();
  updatePoliticalPlot();
  updateViolinPlot();

}


/* ==========================================================
   9. TOGGLE
   ========================================================== */

document
  .getElementById(
    "compareToggle"
  )
  .addEventListener(
    "click",
    () => {

      if (
        ukResults.length === 0
      ) {

        return;

      }


      showUK =
        !showUK;


      updateDisplay();

    }
  );


/* ==========================================================
   10. INITIALISE
   ========================================================== */

async function initialise() {

  await loadUKData();


  /*
  Force the first load to draw even if there are zero rows.
  */

  lastStudentSignature =
    "__initial__";


  await refreshStudentResults();


  setInterval(
    refreshStudentResults,
    3000
  );

}


initialise();
</script>

</body>
</html>
